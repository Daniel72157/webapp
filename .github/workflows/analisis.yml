name: Análisis completo

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint + pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Pruebas (pytest)
        run: pytest -v

  seguridad:
    name: Seguridad (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Bandit (código)
        continue-on-error: true   # informativo: no bloquea
        run: bandit -r . -c bandit.yaml -ll -f txt

      - name: pip-audit (dependencias vulnerables)
        continue-on-error: true   # informativo: no bloquea
        run: pip-audit -r requirements.txt

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: daniel72157
      SONAR_PROJECT_KEY: Daniel72157_webapp
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar proyecto existente
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/components/show?component=${SONAR_PROJECT_KEY}")

          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::error::El token no es valido o no tiene acceso (HTTP ${status}). Revisa el secreto SONAR_TOKEN."
            exit 1
          fi

          if [ "$status" != "200" ]; then
            echo "::error::No existe el proyecto '${SONAR_PROJECT_KEY}' en Sonar (HTTP ${status}). Se cancela para no crear uno nuevo."
            echo "Claves de proyecto disponibles en la organizacion:"
            curl -s -H "Authorization: Bearer ${SONAR_TOKEN}" \
              "${SONAR_HOST_URL}/api/projects/search?organization=${SONAR_ORGANIZATION}" \
              | jq -r '.components[]?.key' || true
            exit 1
          fi

          echo "Proyecto encontrado: ${SONAR_PROJECT_KEY}"

      - name: Analisis
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.exclusions=.github/**,tests/**
            -Dsonar.tests=tests
            -Dsonar.python.version=3.11,3.12
            -Dsonar.qualitygate.wait=true

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
