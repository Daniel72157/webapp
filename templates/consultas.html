<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultas · AWS Panel</title>
<style>
  :root { --bg:#0b1020; --panel:#141b34; --panel2:#1b2447; --line:#27325e;
          --txt:#e8ecff; --mut:#8f9bc7; --a:#ff9900; --b:#6c5ce7; --c:#00d4aa; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI", system-ui, Arial, sans-serif; color: var(--txt);
         background: radial-gradient(1200px 600px at 10% -10%, #26206b55, transparent),
                     radial-gradient(900px 500px at 100% 0%, #ff990022, transparent), var(--bg);
         min-height: 100vh; display: flex; }
  aside { width: 270px; padding: 24px 16px; background: #0d1329; border-right: 1px solid var(--line);
          position: sticky; top: 0; height: 100vh; flex-shrink: 0; overflow-y: auto; }
  .logo { font-weight: 800; font-size: 20px; margin-bottom: 4px; }
  .logo span { color: var(--a); }
  .sub { color: var(--mut); font-size: 12px; margin-bottom: 18px; }
  .back { display: block; padding: 10px 14px; margin-bottom: 18px; border-radius: 10px; font-size: 14px;
          background: var(--panel2); border: 1px solid var(--line); color: var(--txt); text-decoration: none; }
  .back:hover { border-color: var(--a); }
  .grp { color: var(--mut); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin: 16px 8px 8px; }
  nav button { width: 100%; text-align: left; background: none; border: none; color: var(--mut);
               padding: 11px 14px; margin-bottom: 4px; border-radius: 10px; font-size: 14px;
               cursor: pointer; transition: .2s; }
  nav button:hover { background: var(--panel2); color: var(--txt); }
  nav button.on { background: linear-gradient(90deg, var(--b), #8a7dff); color: #fff;
                  box-shadow: 0 6px 18px #6c5ce755; }
  main { flex: 1; padding: 30px 34px; min-width: 0; }
  h1 { font-size: 26px; margin-bottom: 6px; }
  .lead { color: var(--mut); margin-bottom: 22px; font-size: 14px; max-width: 760px; line-height: 1.5; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .bar { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; padding: 18px; border-bottom: 1px solid var(--line); }
  .f label { display: block; font-size: 12px; color: var(--mut); text-transform: uppercase;
             letter-spacing: .06em; margin-bottom: 6px; }
  input, select { background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
          padding: 10px 14px; border-radius: 10px; width: 240px; max-width: 100%; outline: none; font-size: 14px; }
  input:focus, select:focus { border-color: var(--b); }
  .btn { border: none; cursor: pointer; border-radius: 10px; padding: 11px 20px; font-weight: 700;
         font-size: 14px; background: linear-gradient(90deg, var(--c), #00a98a); color: #04201a; transition: .2s; }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .meta { padding: 12px 18px; color: var(--mut); font-size: 13px; border-bottom: 1px solid var(--line); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 12px 18px; color: var(--mut); font-size: 12px; text-transform: uppercase;
       letter-spacing: .06em; background: #10173180; white-space: nowrap; }
  td { padding: 13px 18px; border-top: 1px solid var(--line); white-space: nowrap; }
  tbody tr:hover { background: var(--panel2); }
  tr.tot td { background: #00d4aa14; font-weight: 700; }
  .id { font-family: Consolas, monospace; color: var(--a); font-weight: 600; }
  .pill { background: #6c5ce733; color: #b8b0ff; padding: 4px 11px; border-radius: 999px; font-size: 12px; }
  .money { color: var(--c); font-weight: 600; }
  a.m { color: #7fb0ff; text-decoration: none; }
  .msg { padding: 40px; text-align: center; color: var(--mut); }
  .err { color: #ff7b8a; }
  .spin { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--a);
          border-radius: 50%; animation: s 1s linear infinite; margin: 0 auto 12px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (max-width: 800px) { body { flex-direction: column; } aside { width: 100%; height: auto; position: static; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; } nav button { width: auto; } main { padding: 20px; } }
</style>
</head>
<body>
<aside>
  <div class="logo">☁️ AWS <span>Panel</span></div>
  <div class="sub">Consultas a DynamoDB</div>
  <a class="back" href="/">← Volver al panel de datos</a>
  <nav id="menu"></nav>
</aside>

<main>
  <h1 id="titulo"></h1>
  <p class="lead" id="desc"></p>
  <div class="box">
    <div class="bar" id="barra"></div>
    <div class="meta" id="meta" style="display:none"></div>
    <div class="scroll" id="contenido"><div class="msg">Selecciona una consulta.</div></div>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const cop = n => "$" + Number(n).toLocaleString("es-CO");

  const CONSULTAS = [
    {g: "Consultas básicas"},
    {id: "cliente", t: "Buscar cliente por ID",
     d: "Equivale a get-item sobre la tabla clientes con la llave clienteId.",
     p: {n: "id", etq: "ClienteId", tipo: "text", def: "C001"}},
    {id: "productos_precio", t: "Productos con precio mayor a…",
     d: "Escanea la tabla productos y filtra los que superan el precio indicado.",
     p: {n: "min", etq: "Precio mayor a", tipo: "number", def: 1000}},
    {id: "sucursales", t: "Sucursales según la ciudad",
     d: "Filtra la tabla sucursales por ciudad.",
     p: {n: "ciudad", etq: "Ciudad", tipo: "select", op: "ciudades", def: "Bogotá"}},
    {g: "Retos"},
    {id: "reto3", t: "Reto 3 · Productos vendidos en una ciudad",
     d: "Busca los clientes de la ciudad, sus ventas, el productoId de cada una y consulta los productos. Muestra producto, categoría, cliente y ciudad.",
     p: {n: "ciudad", etq: "Ciudad", tipo: "select", op: "ciudades", def: "Medellín"}},
    {id: "reto4", t: "Reto 4 · Ingresos por categoría",
     d: "Flujo: Ventas → productoId → Productos → categoría → suma de cantidad × precio.",
     p: null},
    {id: "reto5", t: "Reto 5 · Clientes que compraron una categoría",
     d: "Busca los productos de la categoría, sus ventas, obtiene los clienteId, elimina duplicados y consulta Clientes.",
     p: {n: "categoria", etq: "Categoría", tipo: "select", op: "categorias", def: "Almacenamiento"}}
  ];

  let opciones = {ciudades: [], categorias: []}, actual = null;

  function menu() {
    $("menu").innerHTML = CONSULTAS.map(c => c.g
      ? `<div class="grp">${c.g}</div>`
      : `<button data-id="${c.id}">${esc(c.t)}</button>`).join("");
    document.querySelectorAll("nav button").forEach(b =>
      b.onclick = () => elegir(CONSULTAS.find(c => c.id === b.dataset.id)));
  }

  function campo(p) {
    if (!p) return "";
    if (p.tipo === "select") {
      const lista = [...new Set([p.def, ...opciones[p.op]])];
      return `<div class="f"><label>${p.etq}</label><select id="param">` +
        lista.map(o => `<option ${o === p.def ? "selected" : ""}>${esc(o)}</option>`).join("") + `</select></div>`;
    }
    return `<div class="f"><label>${p.etq}</label><input id="param" type="${p.tipo}" value="${esc(p.def)}"></div>`;
  }

  function elegir(c) {
    actual = c;
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.id === c.id));
    $("titulo").textContent = c.t;
    $("desc").textContent = c.d;
    $("barra").innerHTML = campo(c.p) + `<button class="btn" onclick="ejecutar()">▶ Ejecutar consulta</button>`;
    if ($("param")) $("param").addEventListener("keydown", e => { if (e.key === "Enter") ejecutar(); });
    ejecutar();
  }

  function celda(i, v, r) {
    if (v === null || v === undefined) return "";
    if (r.dinero && r.dinero.includes(i)) return `<span class="money">${cop(v)}</span>`;
    const col = r.columnas[i].toLowerCase();
    if (/id$/.test(col)) return `<span class="id">${esc(v)}</span>`;
    if (col === "ciudad" || col.startsWith("categor")) return `<span class="pill">${esc(v)}</span>`;
    if (col === "correo") return `<a class="m" href="mailto:${esc(v)}">${esc(v)}</a>`;
    return esc(v);
  }

  async function ejecutar() {
    const c = actual; if (!c) return;
    const t0 = performance.now();
    $("meta").style.display = "none";
    $("contenido").innerHTML = '<div class="msg"><div class="spin"></div>Consultando DynamoDB...</div>';
    try {
      const q = c.p ? "?" + c.p.n + "=" + encodeURIComponent($("param").value) : "";
      const r = await fetch("/q/" + c.id + q);
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || "Error en la consulta");
      const ms = Math.round(performance.now() - t0);
      $("meta").style.display = "block";
      const n = d.total ? d.filas.length - 1 : d.filas.length;
      $("meta").textContent = `${n} resultado(s) · ${ms} ms`;
      if (!d.filas.length || (d.total && d.filas.length === 1 && d.filas[0][1] === 0 && n === 0)) {
        $("contenido").innerHTML = `<div class="msg">📭 ${esc(d.vacio)}</div>`; return;
      }
      let h = "<table><thead><tr>" + d.columnas.map(x => `<th>${esc(x)}</th>`).join("") + "</tr></thead><tbody>";
      d.filas.forEach((f, k) => {
        const esTotal = d.total && k === d.filas.length - 1;
        h += `<tr class="${esTotal ? "tot" : ""}">` + f.map((v, i) => `<td>${celda(i, v, d)}</td>`).join("") + "</tr>";
      });
      $("contenido").innerHTML = h + "</tbody></table>";
    } catch (e) {
      $("contenido").innerHTML = `<div class="msg err">⚠️ ${esc(e.message)}</div>`;
    }
  }

  (async function () {
    menu();
    try { opciones = await (await fetch("/q/opciones")).json(); } catch (e) {}
    if (!opciones.ciudades) opciones = {ciudades: [], categorias: []};
    elegir(CONSULTAS.find(c => c.id));
  })();
</script>
</body>
</html>
