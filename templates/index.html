<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel AWS · EC2 + DynamoDB</title>
<style>
  :root { --bg:#0b1020; --panel:#141b34; --panel2:#1b2447; --line:#27325e;
          --txt:#e8ecff; --mut:#8f9bc7; --a:#ff9900; --b:#6c5ce7; --c:#00d4aa; --r:#ff5d6c; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI", system-ui, Arial, sans-serif; color: var(--txt);
         background: radial-gradient(1200px 600px at 10% -10%, #26206b55, transparent),
                     radial-gradient(900px 500px at 100% 0%, #ff990022, transparent), var(--bg);
         min-height: 100vh; display: flex; }
  aside { width: 230px; padding: 24px 16px; background: #0d1329; border-right: 1px solid var(--line);
          position: sticky; top: 0; height: 100vh; flex-shrink: 0; overflow-y: auto; }
  .logo { font-weight: 800; font-size: 20px; margin-bottom: 4px; }
  .logo span { color: var(--a); }
  .sub { color: var(--mut); font-size: 12px; margin-bottom: 18px; }
  .goq { display: block; padding: 11px 14px; margin-bottom: 18px; border-radius: 10px;
         background: linear-gradient(90deg, #ff9900, #ffb84d); color: #2a1800; font-weight: 700;
         font-size: 14px; text-decoration: none; text-align: center; transition: .2s; }
  .goq:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .grp { color: var(--mut); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin: 0 8px 8px; }
  nav button { width: 100%; text-align: left; background: none; border: none; color: var(--mut);
               padding: 11px 14px; margin-bottom: 4px; border-radius: 10px; font-size: 14px;
               cursor: pointer; transition: .2s; }
  nav button:hover { background: var(--panel2); color: var(--txt); }
  nav button.on { background: linear-gradient(90deg, var(--b), #8a7dff); color: #fff;
                  box-shadow: 0 6px 18px #6c5ce755; }
  main { flex: 1; padding: 30px 34px; min-width: 0; }
  h1 { font-size: 26px; margin-bottom: 4px; }
  .lead { color: var(--mut); margin-bottom: 24px; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 26px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
          position: relative; overflow: hidden; }
  .card::after { content: ""; position: absolute; right: -30px; top: -30px; width: 100px; height: 100px;
                 border-radius: 50%; background: var(--g); opacity: .18; }
  .card small { color: var(--mut); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .card b { display: block; font-size: 28px; margin-top: 8px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .bar { display: flex; gap: 12px; align-items: center; justify-content: space-between;
         padding: 16px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar h2 { font-size: 18px; text-transform: capitalize; }
  .bar span.c { color: var(--mut); font-size: 13px; margin-left: 8px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; }
  input, select { background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
          padding: 10px 14px; border-radius: 10px; width: 240px; max-width: 100%; outline: none; font-size: 14px; }
  input:focus { border-color: var(--b); }
  input[readonly] { opacity: .6; cursor: not-allowed; }
  .btn { border: none; cursor: pointer; border-radius: 10px; padding: 10px 16px; font-weight: 600;
         font-size: 14px; color: #fff; transition: .2s; }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .btn.new { background: linear-gradient(90deg, var(--c), #00a98a); color: #04201a; }
  .btn.save { background: linear-gradient(90deg, var(--b), #8a7dff); }
  .btn.del { background: var(--r); }
  .btn.ghost { background: var(--panel2); color: var(--mut); border: 1px solid var(--line); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 12px 18px; color: var(--mut); font-size: 12px; text-transform: uppercase;
       letter-spacing: .06em; background: #10173180; cursor: pointer; white-space: nowrap; user-select: none; }
  th:hover { color: var(--a); }
  th.noord { cursor: default; text-align: right; }
  td { padding: 13px 18px; border-top: 1px solid var(--line); white-space: nowrap; }
  tbody tr:hover { background: var(--panel2); }
  td.acc { text-align: right; }
  .ib { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 32px;
        cursor: pointer; font-size: 15px; margin-left: 6px; transition: .2s; }
  .ib:hover { border-color: var(--a); transform: scale(1.08); }
  .ib.x:hover { border-color: var(--r); }
  .id { font-family: Consolas, monospace; color: var(--a); font-weight: 600; }
  .pill { background: #6c5ce733; color: #b8b0ff; padding: 4px 11px; border-radius: 999px; font-size: 12px; }
  .money { color: var(--c); font-weight: 600; }
  a { color: #7fb0ff; text-decoration: none; }
  .msg { padding: 40px; text-align: center; color: var(--mut); }
  .err { color: #ff7b8a; }
  .spin { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--a);
          border-radius: 50%; animation: s 1s linear infinite; margin: 0 auto 12px; }
  @keyframes s { to { transform: rotate(360deg); } }

  /* Modal */
  .ov { position: fixed; inset: 0; background: #050813cc; backdrop-filter: blur(4px); display: none;
        align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .ov.on { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; width: 460px;
           max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px;
           box-shadow: 0 30px 80px #000a; animation: pop .2s ease; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h3 { font-size: 20px; margin-bottom: 4px; }
  .modal p.s { color: var(--mut); font-size: 13px; margin-bottom: 18px; }
  .f { margin-bottom: 14px; }
  .f label { display: block; font-size: 12px; color: var(--mut); text-transform: uppercase;
             letter-spacing: .06em; margin-bottom: 6px; }
  .f input { width: 100%; }
  .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .ferr { color: #ff7b8a; font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* Toast */
  #toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; border-radius: 12px;
           background: var(--panel2); border: 1px solid var(--line); font-size: 14px; z-index: 60;
           transform: translateY(100px); opacity: 0; transition: .3s; box-shadow: 0 10px 30px #0008; }
  #toast.on { transform: none; opacity: 1; }
  #toast.ok { border-color: var(--c); }
  #toast.bad { border-color: var(--r); }

  @media (max-width: 800px) { body { flex-direction: column; } aside { width: 100%; height: auto; position: static; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; } nav button { width: auto; } main { padding: 20px; } }
</style>
</head>
<body>
<aside>
  <div class="logo">☁️ AWS <span>Panel</span></div>
  <div class="sub">EC2 + Flask + DynamoDB</div>
  <a class="goq" href="/consultas">🔍 Ir a Consultas</a>
  <div class="grp">Tablas</div>
  <nav id="menu">
    {% for t in tablas %}<button data-t="{{ t }}">{{ t|capitalize }}</button>{% endfor %}
  </nav>
</aside>

<main>
  <h1>Panel de datos</h1>
  <p class="lead">Administra los registros de tus tablas de DynamoDB en tiempo real.</p>

  <div class="cards">
    <div class="card" style="--g:var(--b)"><small>Clientes</small><b id="k-clientes">…</b></div>
    <div class="card" style="--g:var(--a)"><small>Productos</small><b id="k-productos">…</b></div>
    <div class="card" style="--g:var(--c)"><small>Ventas</small><b id="k-ventas">…</b></div>
    <div class="card" style="--g:#ff5d8f"><small>Ingresos</small><b id="k-ingresos">…</b></div>
  </div>

  <div class="box">
    <div class="bar">
      <div><h2 id="titulo">Selecciona una tabla</h2><span class="c" id="cuenta"></span></div>
      <div class="tools">
        <input id="buscar" placeholder="🔎 Buscar en la tabla..." oninput="pintar()">
        <button class="btn new" onclick="abrirForm(null)">➕ Nuevo</button>
      </div>
    </div>
    <div class="scroll" id="contenido"><div class="msg">Elige una tabla del menú.</div></div>
  </div>
</main>

<!-- Modal crear / editar -->
<div class="ov" id="ovForm">
  <div class="modal">
    <h3 id="fTitulo"></h3>
    <p class="s" id="fSub"></p>
    <div id="fCampos"></div>
    <div class="ferr" id="fErr"></div>
    <div class="row">
      <button class="btn ghost" onclick="cerrar('ovForm')">Cancelar</button>
      <button class="btn save" id="fGuardar" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal eliminar -->
<div class="ov" id="ovDel">
  <div class="modal">
    <h3>🗑️ Eliminar registro</h3>
    <p class="s" id="dTexto"></p>
    <div class="row">
      <button class="btn ghost" onclick="cerrar('ovDel')">Cancelar</button>
      <button class="btn del" onclick="confirmarEliminar()">Sí, eliminar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let datos = [], cols = [], tipos = {}, clave = "", vista = [];
  let orden = {col: null, asc: true}, actual = "", editando = null, porBorrar = null;

  const cop = n => "$" + Number(n).toLocaleString("es-CO");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const $ = id => document.getElementById(id);

  function toast(texto, ok = true) {
    const t = $("toast");
    t.textContent = (ok ? "✅ " : "⚠️ ") + texto;
    t.className = "on " + (ok ? "ok" : "bad");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.className = "", 3200);
  }

  function celda(col, v) {
    if (v === undefined || v === null) return "";
    if (/Id$/.test(col)) return `<span class="id">${esc(v)}</span>`;
    if (/^(precio|total)$/.test(col)) return `<span class="money">${cop(v)}</span>`;
    if (/^(ciudad|categoria)$/.test(col)) return `<span class="pill">${esc(v)}</span>`;
    if (col === "correo") return `<a href="mailto:${esc(v)}">${esc(v)}</a>`;
    return esc(v);
  }

  function pintar() {
    const q = $("buscar").value.toLowerCase();
    vista = datos.filter(d => JSON.stringify(d).toLowerCase().includes(q));
    if (orden.col) vista.sort((a, b) => {
      const x = a[orden.col] ?? "", y = b[orden.col] ?? "";
      return (x > y ? 1 : x < y ? -1 : 0) * (orden.asc ? 1 : -1);
    });
    $("cuenta").textContent = vista.length + " registros";
    if (!vista.length) {
      $("contenido").innerHTML = '<div class="msg">Sin registros. Pulsa «➕ Nuevo» para crear uno.</div>';
      return;
    }
    let h = "<table><thead><tr>" + cols.map(c =>
      `<th onclick="ordenar('${c}')">${esc(c)} ${orden.col === c ? (orden.asc ? "▲" : "▼") : ""}</th>`).join("")
      + '<th class="noord">Acciones</th></tr></thead><tbody>';
    vista.forEach((f, i) => {
      h += "<tr>" + cols.map(c => `<td>${celda(c, f[c])}</td>`).join("") +
        `<td class="acc"><button class="ib" title="Editar" onclick="abrirForm(${i})">✏️</button>` +
        `<button class="ib x" title="Eliminar" onclick="pedirEliminar(${i})">🗑️</button></td></tr>`;
    });
    $("contenido").innerHTML = h + "</tbody></table>";
  }

  function ordenar(c) { orden = {col: c, asc: orden.col === c ? !orden.asc : true}; pintar(); }

  async function cargar(t) {
    actual = t; orden = {col: null, asc: true};
    $("buscar").value = "";
    $("titulo").textContent = t;
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    $("contenido").innerHTML = '<div class="msg"><div class="spin"></div>Cargando datos...</div>';
    try {
      const r = await fetch("/api/" + t);
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      datos = d.items; cols = d.columnas; tipos = d.tipos; clave = d.clave;
      pintar();
    } catch (e) {
      $("cuenta").textContent = "";
      $("contenido").innerHTML = `<div class="msg err">⚠️ ${esc(e.message)}</div>`;
    }
  }

  async function resumen() {
    try {
      const d = await (await fetch("/api/resumen")).json();
      if (d.error) throw 0;
      ["clientes", "productos", "ventas"].forEach(k => $("k-" + k).textContent = d[k]);
      $("k-ingresos").textContent = cop(d.ingresos);
    } catch (e) {
      ["clientes", "productos", "ventas", "ingresos"].forEach(k => $("k-" + k).textContent = "—");
    }
  }

  function cerrar(id) { $(id).classList.remove("on"); }

  // ---------- Crear / Editar ----------
  function abrirForm(i) {
    if (!cols.length) return;
    editando = i === null ? null : vista[i];
    $("fTitulo").textContent = editando ? "✏️ Editar registro" : "➕ Nuevo registro";
    $("fSub").textContent = "Tabla: " + actual;
    $("fErr").textContent = "";
    $("fCampos").innerHTML = cols.map(c => {
      const esNum = tipos[c] === "N";
      const tipo = esNum ? "number" : (c === "fecha" ? "date" : "text");
      const val = editando && editando[c] !== undefined ? esc(editando[c]) : "";
      const ro = editando && c === clave ? "readonly" : "";
      const etq = c === clave ? c + " (ID)" : c;
      return `<div class="f"><label>${esc(etq)}</label>` +
             `<input id="f_${c}" type="${tipo}" ${esNum ? 'step="any"' : ""} value="${val}" ${ro}></div>`;
    }).join("");
    $("ovForm").classList.add("on");
    const primero = document.querySelector("#fCampos input:not([readonly])");
    if (primero) primero.focus();
  }

  async function guardar() {
    const cuerpo = {};
    cols.forEach(c => {
      const v = $("f_" + c).value.trim();
      if (v !== "") cuerpo[c] = tipos[c] === "N" ? Number(v) : v;
    });
    if (!cuerpo[clave]) { $("fErr").textContent = `El campo ${clave} es obligatorio.`; return; }
    const btn = $("fGuardar"); btn.disabled = true; btn.textContent = "Guardando...";
    try {
      const url = "/api/" + actual + (editando ? "/" + encodeURIComponent(editando[clave]) : "");
      const r = await fetch(url, {
        method: editando ? "PUT" : "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(cuerpo)
      });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || "Error al guardar");
      cerrar("ovForm");
      toast(editando ? "Registro actualizado" : "Registro creado");
      await cargar(actual); resumen();
    } catch (e) {
      $("fErr").textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = "Guardar";
    }
  }

  // ---------- Eliminar ----------
  function pedirEliminar(i) {
    porBorrar = vista[i];
    $("dTexto").textContent = `Se eliminará el registro ${porBorrar[clave]} de la tabla ${actual}. Esta acción no se puede deshacer.`;
    $("ovDel").classList.add("on");
  }

  async function confirmarEliminar() {
    try {
      const r = await fetch("/api/" + actual + "/" + encodeURIComponent(porBorrar[clave]), {method: "DELETE"});
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || "Error al eliminar");
      cerrar("ovDel");
      toast("Registro eliminado");
      await cargar(actual); resumen();
    } catch (e) {
      cerrar("ovDel");
      toast(e.message, false);
    }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { cerrar("ovForm"); cerrar("ovDel"); }
    if (e.key === "Enter" && $("ovForm").classList.contains("on")) guardar();
  });

  document.querySelectorAll("nav button").forEach(b => b.onclick = () => cargar(b.dataset.t));
  resumen();
  cargar("clientes");
</script>
</body>
</html>
